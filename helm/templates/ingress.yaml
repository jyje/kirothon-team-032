{{- if .Values.ingress.enabled }}
{{- $bodySize := .Values.ingress.proxyBodySize }}
{{- if and (has (lower (trim (toString .Values.config.FEATURE_RECORDING))) (list "true" "yes" "on" "1")) (ne (lower (trim (toString .Values.config.TRANSCRIBER))) "none") }}
{{- $bodySize = .Values.ingress.recordingProxyBodySize }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "open-attendee.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $bodySize | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
{{- end }}
