apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "open-attendee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # PVC가 ReadWriteOnce라서 새 파드가 뜨기 전에 옛 파드를 먼저 내린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-attendee.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-attendee.selectorLabels" . | nindent 8 }}
      annotations:
        # 설정이 바뀌면 파드를 다시 만든다.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}
            # 비밀은 미리 만든 Secret에서만 읽는다. 차트에는 값이 없다.
            - secretRef:
                name: {{ .Values.existingSecret }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "open-attendee.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
