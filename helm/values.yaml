replicaCount: 1

image:
  # Placeholder: the project has no app code yet. Points at the locally built image.
  repository: kirothon
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  # Off by default. Enable once a host is chosen.
  enabled: false
  className: nginx
  # Assumed issuer name, matching the cluster's cert-manager setup.
  clusterIssuer: nginx-letsencrypt-prod
  host: kirothon.example.com

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi
