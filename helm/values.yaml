# 복제본은 1로 둔다. SQLite와 업로드 파일을 PVC 하나에 쓰기 때문이다.
replicaCount: 1

image:
  # 노드가 arm64(Raspberry Pi)라서 linux/arm64 이미지가 있어야 한다.
  # dev, stg, prd 브랜치에 올라가면 CI(.github/workflows/build.yml)가 만든다(dev는 open-attendee-dev, stg는 open-attendee-stg). 태그는 CI 요약에 나오는 r<번호>-<sha7>.
  repository: ghcr.io/jyje/open-attendee
  tag: ""
  pullPolicy: IfNotPresent
# 비공개 레지스트리면 `kubectl create secret docker-registry`로 만든 Secret 이름을 넣는다.
imagePullSecrets: []

# 비밀은 차트에 넣지 않는다. 미리 만든 Secret의 이름만 받는다(docs/deploy.md).
# 필수 키: OWNER_PASSWORD_HASH, SESSION_SECRET
# 선택 키: OPENAI_API_KEY, AWS_BEARER_TOKEN_BEDROCK
existingSecret: open-attendee

# 비밀이 아닌 설정. ConfigMap으로 만들어 환경 변수로 넣는다.
config:
  PROVIDER: openai
  BLOB_BACKEND: local
  FEATURE_RECORDING: "false"
  TRANSCRIBER: none
  AWS_REGION: us-east-1
  # 이 클러스터의 기본 저장소(subdir-usb)는 NFS라서 SQLite WAL을 쓰지 않는다.
  SQLITE_JOURNAL_MODE: delete
  # 인그레스 뒤에서는 모든 요청이 인그레스 IP로 보인다. X-Forwarded-For를 믿어야 로그인 제한이
  # 실제 접속자 IP별로 걸려, 남이 소유자를 잠그지 못한다. 파드는 인그레스를 통해서만 열린다.
  FORWARDED_ALLOW_IPS: "*"

persistence:
  enabled: true
  size: 2Gi
  # 비워 두면 클러스터 기본 StorageClass를 쓴다.
  storageClass: ""
  accessMode: ReadWriteOnce
  # 이미 있는 PVC를 쓰려면 이름을 넣는다.
  existingClaim: ""

service:
  port: 80
  targetPort: 8080

ingress:
  # 호스트를 정하기 전에는 꺼 둔다. port-forward로 먼저 확인할 수 있다.
  enabled: false
  className: nginx
  # 클러스터에 있는 ClusterIssuer 이름.
  clusterIssuer: nginx-letsencrypt-prod
  host: open-attendee.example.com
  # 발표자료 PDF는 30MB까지라서 nginx 기본(1m)보다 크게 둔다. 서버의 상한(413)보다 조금 넉넉하게.
  proxyBodySize: 32m
  # 녹음 기능을 켜면 2 GiB 파일과 멀티파트 헤더를 받을 수 있어야 한다.
  recordingProxyBodySize: 2050m

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

# 차트 밖의 리소스(SealedSecret, ImageUpdater 등)를 Argo CD 앱 하나로 함께 배포한다.
# jyje/mungchilog 차트와 같은 방식이다. 각 항목은 템플릿 문자열이거나 YAML 객체다.
extraResources: []
