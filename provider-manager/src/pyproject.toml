[project]
name = "provider-manager"
version = "0.1.0"
description = "Credentials and inference config for AWS Bedrock, OpenAI and OpenAI Codex"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40.0",
    "strands-agents[openai]>=1.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "ty>=0.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "RUF", "ISC", "TRY"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TRY002"]
