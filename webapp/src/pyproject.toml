[project]
name = "open-attendee"
version = "0.1.0"
description = "Open Attendee: 행사 기록을 출처가 붙은 초안으로 바꾸는 웹앱"
requires-python = ">=3.13,<3.14"
dependencies = [
    "provider-manager",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8.0",
    "langgraph>=0.2.0",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "pypdf>=5.0.0",
    "python-pptx>=1.0.0",
    "opencv-python-headless>=4.10.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "boto3>=1.40.0",
]

[project.optional-dependencies]
# 로컬 전사(1단계). Raspberry Pi 이미지에는 넣지 않는다.
stt = ["faster-whisper>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_attendee"]

[tool.uv.sources]
provider-manager = { path = "../../provider-manager/src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "RUF", "ISC", "TRY"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TRY002"]
